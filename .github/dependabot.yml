version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5

    # Wait a week after a release before proposing it. Merging deploys
    # straight to the site, so a compromised release should have time to be
    # noticed and pulled before it can reach us.
    #
    # Cooldown applies to version updates only; security updates are not
    # delayed.
    cooldown:
      default-days: 7

    # Major bumps stay a deliberate decision. They can change what the page
    # renders, and merging now deploys straight to the site, so a major
    # should land when someone is ready to look at the result.
    #
    # The "version-update:" prefix scopes this to version updates, so a
    # security fix that only exists in a newer major is still offered.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

    groups:
      # One pull request a week for routine updates, instead of one per
      # package.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

      # Without this, a batch of advisories arrives as a batch of pull
      # requests: 25 alerts landed that way before this file existed.
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # Actions are pinned to commit SHAs in the workflows, so without this
  # nothing would ever move them. Majors are not excluded the way they are
  # for npm: an action version cannot change what the site renders, and
  # staying current with them is itself a supply-chain measure.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo

    # Same reason as for bun above: wait a week before taking a new release.
    cooldown:
      default-days: 7

    groups:
      actions:
        patterns:
          - '*'

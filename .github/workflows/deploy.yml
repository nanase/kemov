name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job needs the Cloudflare token, and it gets that from the
# environment it names rather than from anything granted here.
permissions:
  contents: read

# Never let two deployments race. Queue instead of cancelling: a cancelled
# deployment could leave the site mid-update.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Deploy only what passes. main is protected by CI on the way in, but this
  # makes a broken build unable to reach Cloudflare even if something lands
  # another way. It is a job of its own so that it runs outside the
  # environment holding the token.
  #
  # It checks the site as well as the worker, because one deploy now carries
  # both. While they went out separately, a worker test holding the site back
  # would have been a test blocking an unrelated release; now a failure in
  # either is a failure of the one artifact.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step talks to GitHub, so the token has no reason to stay
          # behind in the local git config.
          persist-credentials: false

      - name: Install the Node and bun pinned in mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Report tool versions
        run: node --version && bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Type check the worker
        run: bun run type-check:worker

      - name: Test
        run: bun run vitest run --project frontend

      - name: Test the worker
        run: bun run vitest run --project worker

  deploy:
    needs: check
    runs-on: ubuntu-latest

    # The Cloudflare credentials live in this environment rather than in
    # repository secrets, so only a job that names it can read them.
    # Repository secrets are readable by every workflow in the repository,
    # including one running from a pull request branch of it, and most of
    # those have no business holding a token that can deploy.
    environment: cloudflare

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step talks to GitHub, so the token has no reason to stay
          # behind in the local git config.
          persist-credentials: false

      - name: Install the Node and bun pinned in mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Report tool versions
        run: node --version && bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Into ./dist, which is what wrangler.toml's [assets] uploads. Built
      # here rather than passed from the check job as an artifact, because the
      # deploy has to have the files on disk for wrangler and an artifact
      # round trip would only add a way for the two to differ.
      - name: Build the site
        run: bun run build-only

      # Before the deploy, so the code that lands never meets a schema older
      # than itself. wrangler records what it has applied in a d1_migrations
      # table, which makes this a no-op on a run that adds no migration, and
      # outside a terminal it answers its own confirmation prompt with yes.
      - name: Apply the migrations
        run: bun wrangler d1 migrations apply kemov --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # One command puts up the worker and the site together. They were two
      # workflows until #70, and two workflows meant one could succeed while
      # the other did not - which happened: the worker deployed green while
      # its secrets were missing, and nothing was collected for two and a half
      # hours.
      #
      # wrangler comes from the lockfile, so what deploys here is the version
      # the repository was tested against. It reads the account from the
      # environment because wrangler.toml deliberately holds no account_id.
      - name: Deploy the worker and the site
        run: bun wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Names and types, never values: that is all the command returns. After
      # the deploy rather than before it, because secrets belong to a worker
      # that exists and wrangler answers `Worker "kemov" not found` until the
      # first one has run.
      - name: List the registered secrets
        run: bun wrangler secret list > "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A missing secret cannot stop a deploy: wrangler resolves the bindings
      # in wrangler.toml and never looks at the secrets, so the worker ships
      # and the jobs fail one at a time inside D1 where nobody is reading.
      # That is #89. Failing here is how anybody finds out. The step needs no
      # credentials: the list is already on disk.
      - name: Check the declared secrets are registered
        run: bun run check-secrets "$RUNNER_TEMP/secrets.json"

name: Audit

on:
  schedule:
    # Mondays 09:00 JST.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step talks to GitHub, so the token has no reason to stay
          # behind in the local git config.
          persist-credentials: false

      - name: Install the Node and bun pinned in mise.toml
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Report tool versions
        run: node --version && bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Dependabot already raises alerts; this is a second, independent look
      # that also runs when nobody is watching the security tab.
      - name: Audit
        run: bun audit --audit-level=high

      # bun reports moderate findings alongside real advisories at the
      # default level. Those are worth seeing but not worth failing on.
      - name: Report moderate findings
        if: always()
        run: |
          {
            echo '### `bun audit --audit-level=moderate`'
            echo
            echo '```'
            bun audit --audit-level=moderate || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

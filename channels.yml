# The streamers this site follows.
#
# This file is the master copy of the columns the deploy writes into the
# `channel` table of D1. `scripts/check-channels.js` validates it on every CI
# run, and `scripts/build-channels-sql.js` turns it into the upsert the deploy
# applies. See "The Channel Master" in README.md.
#
# Field names are the column names they land in, with two exceptions. `color`
# groups the four values because a person edits them together, and the seed
# spreads them across `color_key`, `color_sub`, `color_light` and `color_back`.
#
# `twitch` lands nowhere. The `channel` table has no column for it and nothing
# in the site reads it, so the seed does not carry it. It is kept because a
# person wrote these three handles by hand into the JSON this file replaces,
# and #72 retires that JSON: dropping them here would lose them for good.
# Showing them later costs one migration, and only if the data survived.
#
# Never delete an entry. `channel_snapshot` and `video` reference `channel`,
# and D1 refuses a delete that would orphan them - which is the point, because
# the history of a streamer who stopped is still the history. A streamer who
# stops gets an `activity_end_date`.
#
# Entries are ordered by `activity_start_date`, oldest first.


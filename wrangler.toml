# Cloudflare Workers configuration.
#
# There is no account_id here on purpose. This repository is public, and that
# value names the account it belongs to. `wrangler` resolves the account from
# the session `wrangler login` leaves in the home directory; Actions hands it
# CLOUDFLARE_ACCOUNT_ID from an environment secret. Neither route puts it in a
# file that gets committed.

name = "kemov"
main = "worker/src/index.ts"

# The newest compatibility date the workerd bundled with
# @cloudflare/vitest-plugin accepts, so the tests and production share
# one set of semantics. Overriding it for the tests instead would leave them
# verifying a behaviour production does not have. See #74.
compatibility_date = "2026-09-16"

# The workers.dev subdomain, off. It is generated from the account's email
# address and the local part appears in it verbatim, so every successful
# deploy would print it into a log that anyone can read - the Actions logs of
# a public repository are public. Nothing needs it once the route below
# exists, and the route is applied by the same deploy that turns this off.
workers_dev = false

# The master copy of every channel, video and snapshot. The worker has no other
# store, so every job and every endpoint goes through this binding.
#
# migrations_dir is left at its default, "migrations", which is where #60 puts
# the schema.
[[d1_databases]]
binding = "DB"
database_name = "kemov"
# Assigned by `wrangler d1 create`. Unlike account_id this one is committed: it
# names a database that nothing without credentials can reach.
database_id = "ab4f1ccb-f66a-4bec-9ffb-b5dfb9753be5"

# The collection schedule decided in #58. The jobs themselves arrive in #62 to
# #65; until then the worker accepts the events and does nothing, which keeps
# the schedule and the deploy verifiable on their own.
[triggers]
crons = [
  # channel-stats, video-discover, video-update, and retention on the first
  # tick of each hour (#223)
  "*/10 * * * *",
  # chat-replay
  "* * * * *",
  # backup. Twenty past midnight UTC, so that the day it writes has been over
  # long enough for the last ten-minute tick of it to have landed.
  "20 0 * * *",
]

# Where the backup writes (#111). D1 is the only copy of two things: the
# snapshot history, which began on 2026-09-07, and the chat counts #65 worked
# out for itself. Neither is anywhere else, and #72 takes away the old system
# that has been standing in as a copy of the rest.
#
# Prefix-specific lifecycle rules are set on this bucket, in addition to its
# existing Default Multipart Abort Rule, because one rule covering the whole
# bucket would be wrong: see docs/reference/data.md
# for the rules and why.
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "kemov-backup"

# Where the admin site's published JSON lives (#144). A bucket of its own
# rather than a prefix on `kemov-backup`: the two buckets carry opposite
# lifecycle rules, and a rule meant for one accidentally reaching the other
# would either expire published data or leave backup files forever. Not
# backed up here either - see docs/reference/data.md for why not, and
# docs/guides/deployment.md for how to create the bucket.
[[r2_buckets]]
binding = "PUBLIC_DATA"
bucket_name = "kemov-public"

# Public on purpose: this is the same domain a browser is sent to for the
# Access login page, so committing it protects nothing a secret would.
# `verifyAccess` (worker/src/lib/access.ts) fetches this team's public keys
# from it and reads a token's `iss` claim against it.
[vars]
ACCESS_TEAM_DOMAIN = "nanase.cloudflareaccess.com"

# The site itself, built from src/ by vite.
#
# Cloudflare serves a request that matches a built file directly and never
# wakes the worker for it, so `main` sees /api/* and the paths that are not
# files. That is what lets one deploy carry both: no route ordering to get
# right, no second project, and the boundary between the two is a branch in
# code that the tests can reach rather than a setting nobody can see until
# something 404s in production.
[assets]
directory = "./dist"
binding = "ASSETS"
# The pages that carry the reader's colour theme (#182). The worker answers
# these itself, from the same files, with the theme written in, because the
# browser picks a page's canvas colour before any script in it can run. Only
# HTML is listed: the hashed scripts, stylesheets, fonts and images are still
# served without waking the worker, and every path added here is one more
# invocation per page view. worker/src/lib/themed-pages.ts holds the same
# list, and test/worker-config.test.ts holds the two together and to the pages
# vite builds. /admin/ is not one of them: it is light only.
run_worker_first = ["/", "/stats/", "/stats/detail/", "/members/", "/videos/", "/genet/music/"]

# The site's own hostname. A custom domain rather than a route pattern:
# Cloudflare creates and keeps the DNS record for it, which is what makes this
# reviewable here instead of being a click somewhere else.
[[routes]]
pattern = "kemov.nanase.cc"
custom_domain = true

# No secret is listed here. Secrets are set with `wrangler secret put` and read
# from the environment at runtime; see docs/guides/deployment.md.

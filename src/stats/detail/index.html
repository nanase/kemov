<!doctype html>
<!--
  The old member page's address, kept only to send readers on (#144).

  Links to `/stats/detail/#/<channel id>` were shared and bookmarked. The
  member is in the fragment, which a request never carries, so the worker
  cannot redirect these and this page does it in the browser instead.

  Remove after 2027-09-30, a year after the redirects went in: by then a link
  nobody has opened in a year is not worth a page. To remove it, delete this
  directory and its `statsDetail` entry in vite.config.ts, and in the same
  change add `'/stats/detail/': '/members/'` to LANDING in
  worker/src/lib/site.ts. The file has to go and the rule has to come in
  together: with only the rule the file still answers first, and with only the
  deletion the address is a 404.
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>移動しています - けもV</title>
    <style>
      /*
       * Only the background, so the page does not flash white on its way out.
       * The values repeat --k-bg from src/shell/tokens.css;
       * test/stats/detail/destination.test.ts keeps them the same.
       */
      html {
        background-color: #e9eeec;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background-color: #0e0f10;
        }
      }

      body {
        font-family: sans-serif;
        margin: 2rem 1rem;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <p>このページは移動しました。切り替わらないときは、<a href="/members/">メンバーのページ</a>を開いてください。</p>
    <script type="module">
      import { destinationOf } from './destination';

      location.replace(destinationOf(location.hash));
    </script>
  </body>
</html>
